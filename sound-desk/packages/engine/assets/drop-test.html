<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <title>SoundDesk 拖出测试 / drag-out test</title>
    <style>
      body {
        font: 14px/1.7 system-ui, "Segoe UI", sans-serif;
        margin: 0;
        padding: 24px;
        background: #0d1117;
        color: #e6edf3;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .sub { color: #8b949e; margin-bottom: 18px; }
      #source {
        display: inline-block;
        padding: 14px 22px;
        border: 2px dashed #58a6ff;
        border-radius: 8px;
        background: #161b22;
        cursor: grab;
        user-select: none;
      }
      #source:active { cursor: grabbing; }
      #target {
        margin-top: 20px;
        padding: 40px;
        border: 2px dashed #39414d;
        border-radius: 8px;
        text-align: center;
        color: #6e7681;
      }
      #target.over { border-color: #3fb950; color: #3fb950; }
      ul { padding-left: 18px; }
      code { background: #161b22; padding: 1px 4px; border-radius: 3px; }
      .ok { color: #3fb950; }
      .bad { color: #f85149; }
    </style>
  </head>
  <body>
    <h1>SoundDesk 拖出测试</h1>
    <div class="sub">
      把蓝色方块拖到下面的框里（或直接拖到桌面 / 文件管理器 / DAW）。框里会列出浏览器实际
      收到的 MIME 类型，用来看拖拽到底带出了什么。
    </div>

    <div id="source" draggable="true">拖我（一个真实素材文件）</div>

    <div id="target">把方块拖到这里</div>

    <h3>拖拽数据（dragstart 时设置的 MIME）</h3>
    <ul id="mimes"><li>拖动后显示</li></ul>

    <h3>drop 时实际收到的 MIME</h3>
    <ul id="dropped"><li>拖放后显示</li></ul>

    <h3>文件列表（若拖出的是真文件）</h3>
    <ul id="files"><li>拖放后显示</li></ul>

    <script>
      // The page is served by the engine, so it can ask for one of its own assets.
      const params = new URLSearchParams(location.search);
      const token = params.get('token') || '';
      const base = location.origin;

      const source = document.getElementById('source');
      const target = document.getElementById('target');
      const mimesEl = document.getElementById('mimes');
      const droppedEl = document.getElementById('dropped');
      const filesEl = document.getElementById('files');

      let asset = null;
      let downloadUrl = '';

      async function pickAsset() {
        const res = await fetch(`${base}/api/search`, {
          method: 'POST',
          headers: { 'x-sounddesk-token': token, 'content-type': 'application/json' },
          body: JSON.stringify({ q: '', limit: 1 }),
        });
        if (!res.ok) throw new Error(`search ${res.status}`);
        const data = await res.json();
        const hit = data.hits && data.hits[0];
        // An empty query returns nothing; fall back to browsing the catalogue.
        if (hit) return hit.asset;
        const page = await fetch(`${base}/api/assets?limit=1`, { headers: { 'x-sounddesk-token': token } });
        const list = await page.json();
        return list.items && list.items[0];
      }

      (async () => {
        try {
          asset = await pickAsset();
          if (!asset) throw new Error('库里没有素材');
          downloadUrl = `${base}/api/media/${asset.id}/download?token=${encodeURIComponent(token)}`;
          source.textContent = `拖我：${asset.filename}`;
        } catch (err) {
          source.textContent = `无法取到素材：${err.message}`;
        }
      })();

      source.addEventListener('dragstart', (ev) => {
        if (!asset) {
          ev.preventDefault();
          return;
        }
        const dt = ev.dataTransfer;
        const listed = [];

        // 1. The download URL, so a drop target that understands URLs can fetch it.
        dt.setData('text/uri-list', downloadUrl);
        dt.setData('text/plain', downloadUrl);
        listed.push('text/uri-list', 'text/plain');

        // 2. Chromium's "drag this URL out as a file" flavour.
        try {
          dt.setData('DownloadURL', `${asset.filename}:${downloadUrl}:${asset.mimeType || 'audio/wav'}`);
          listed.push('DownloadURL');
        } catch (err) {
          listed.push(`DownloadURL 失败：${err.message}`);
        }

        dt.effectAllowed = 'copy';
        mimesEl.innerHTML = listed.map((m) => `<li><code>${m}</code></li>`).join('');
      });

      target.addEventListener('dragover', (ev) => {
        ev.preventDefault();
        target.classList.add('over');
      });
      target.addEventListener('dragleave', () => target.classList.remove('over'));

      target.addEventListener('drop', (ev) => {
        ev.preventDefault();
        target.classList.remove('over');
        const names = Array.from(ev.dataTransfer.types || []);
        droppedEl.innerHTML = names.length
          ? names.map((t) => `<li><code>${t}</code></li>`).join('')
          : '<li class="bad">（没有收到任何 MIME —— 拖拽数据被清空了）</li>';

        const files = Array.from(ev.dataTransfer.files || []);
        filesEl.innerHTML = files.length
          ? files
              .map(
                (f) =>
                  `<li class="ok">${f.name} · ${f.size} bytes · ${f.type || '(无 MIME)'}</li>`,
              )
              .join('')
          : '<li>（没有文件 —— 如果拖到桌面能出文件，这里为空也是正常的，浏览器不会把拖出的文件回传给源页面）</li>';
      });
    </script>
  </body>
</html>
