<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设计文档坐标</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header class="bar">
  <span class="brand">设计文档坐标</span>
  <button id="open-tab" class="icon" title="在标签页里打开">⧉</button>
</header>

<p id="banner" class="banner" hidden>
  <span id="banner-text"></span>
  <button id="enable" class="mini">启用本页</button>
</p>

<section class="doc">
  <div class="row"><span class="k">文档</span><span id="doc-title" class="v">—</span></div>
  <div class="row"><span class="k">路径</span><code id="doc-path" class="v">—</code></div>
</section>

<section class="current">
  <div class="label">
    <span>当前坐标</span>
    <span id="source" class="tag" hidden></span>
    <span id="pin" class="pin" hidden>已固定</span>
  </div>
  <code id="coord" class="coord">—</code>
  <div id="where" class="where"></div>
  <div id="excerpt" class="excerpt"></div>
  <div class="actions">
    <button id="copy" class="primary">复制</button>
    <button id="copy-context" class="ghost">复制上下文</button>
  </div>
</section>

<section class="history">
  <div class="label">
    <span>已复制 <b id="count">0</b></span>
    <button id="clear" class="link">清空</button>
  </div>
  <ol id="list" class="list"></ol>
  <div class="actions">
    <button id="copy-all" class="ghost">复制清单</button>
  </div>
</section>

<footer class="settings">
  <label class="field">
    <span>复制格式</span>
    <select id="format">
      <option value="coord">坐标</option>
      <option value="coord-text">坐标 + 原文</option>
      <option value="context">完整上下文</option>
    </select>
  </label>
  <label class="check"><input type="checkbox" id="enabled"> 启用</label>
  <label class="check"><input type="checkbox" id="intercept"> Ctrl+C 复制坐标</label>
  <label class="check"><input type="checkbox" id="highlight"> 悬停高亮</label>
</footer>

<script src="dd-path.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
