# dsh-scoped-mcp bundle patch.
#
# One host plugin: it owns per-scope MCP connections, attaches each agent to the
# effective servers of its workspace, and serves the MCP page's JSON API on the
# composition's own Web server. No MCP server is configured by the patch itself.
#
#   global scope:    <DSH_HOME>/mcp-scope.yml
#   workspace scope: <workspace>/.dsh/mcp.yml
#
# A workspace entry with the same serverName replaces the global entry for that
# workspace; every other global entry still applies there.
- insert:
    - id: dsh-scoped-mcp
      name: dsh-scoped-mcp
