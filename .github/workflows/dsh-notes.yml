name: dsh-notes

on:
  push:
    paths:
      - 'dsh-notes/**'
      - '.github/workflows/dsh-notes.yml'
  pull_request:
    paths:
      - 'dsh-notes/**'
      - '.github/workflows/dsh-notes.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: dsh-notes

jobs:
  test:
    name: ${{ matrix.os }} / Node 24
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dsh-notes/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Checks
        run: npm run check

      - name: Unit / API / security / MCP / host / client tests
        run: npm test

      - name: Smoke (startup, attachment, restart)
        run: npm run smoke

      - name: Browser E2E (Chrome)
        env:
          CHROME_PATH: ${{ runner.os == 'Windows' && 'C:\Program Files\Google\Chrome\Application\chrome.exe' || '' }}
        run: npm run test:e2e

      - name: Upload browser screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: |
            dsh-notes/tmp/e2e-desktop.png
            dsh-notes/tmp/e2e-mobile.png
          if-no-files-found: ignore

  debian:
    name: Debian bookworm / Node 24
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          node -v
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and test (Debian)
        run: |
          npm run build
          npm run check
          npm test
          npm run smoke

  docker:
    name: Docker image / Debian
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f dsh-notes/deploy/docker/Dockerfile -t dsh-notes:ci dsh-notes

  package:
    name: Package archives
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dsh-notes/package-lock.json
      - name: Install, build and pack
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run package:dist
      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: dsh-notes-dist
          path: dsh-notes/dist/
