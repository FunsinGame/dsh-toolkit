# dsh-turn-filediff bundle patch.
#
# The conversation-wide file list is rendered in `conversation.input.dock`
# (taskbar style above the input box) and the plugin also replaces the
# `chatFileMentions` provider so inline-code file references stay clickable
# over the whole conversation's changed-file vocabulary. The shipped
# `ui-deliverables` row owns that same provider, so it must stay disabled to
# avoid a duplicate service registration; the per-turn produced row is
# intentionally replaced by the conversation taskbar.
#
# `editor` is the external editor command (default `code`). Override it in the
# profile's own cordis.patch.yml, or set DSH_TURN_FILEDIFF_EDITOR in the host
# environment.

- id: ui-deliverables
  disabled: true

- insert:
    - id: turn-filediff
      name: dsh-turn-filediff
      config:
        editor: code
