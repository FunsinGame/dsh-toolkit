# dsh-turn-filediff bundle patch.
#
# The per-turn summary lives in the same `conversation.chat.turnTail` chain as
# the shipped "Produced" files row, and that chain elects ONE entry
# (first non-null `select` wins). The shipped `ui-deliverables` row registers
# first and always claims the tail whenever files were produced, so it would
# shadow this plugin's summary. We therefore disable the shipped turn-tail
# occupant and own the tail ourselves — the summary replaces the plain file
# chips with the same files plus per-file `+added -removed` counts and an
# external-editor (VS Code) open action.
#
# `editor` is the external editor command (default `code`). Override it in the
# profile's own cordis.patch.yml, or set DSH_TURN_FILEDIFF_EDITOR in the host
# environment.

- id: ui-deliverables
  disabled: true

- insert:
    - id: turn-filediff
      name: dsh-turn-filediff
      config:
        editor: code
