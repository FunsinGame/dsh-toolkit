# dsh-notify-sound 的 bundle patch：在 profile 组合树上插入一行。
# 这一行启用浏览器半侧（`lib/client.js`），它在以下时机播放一段短提示音：
#   - 任何会话的 Agent 从运行变为空闲（任务结束，后台会话同样生效）；
#   - 任何会话出现需要用户处理的提问 / 计划评审 / 工具审批（后台会话同样生效）。
#
# 本行在 `lib/index.js` 中声明了 Config（所有字段均为 volatile），因此
# Plugins 页上本 bundle 的配置卡片会把每个 profile 的覆盖值写进该 profile
# 自己的 cordis.patch.yml。平时用卡片即可；下面的注释只是手写配置时的等价写法。
- insert:
    - id: notify-sound
      name: dsh-notify-sound
      # config:
      #   # 可选：用音频文件替换合成的完成提示音。
      #   # 支持 http(s) URL、data URI，或由 DSH Web 服务提供的 URL。
      #   completeSound: "https://example.com/complete.mp3"
      #   # 可选：用音频文件替换合成的询问提示音。
      #   questionSound: "data:audio/wav;base64,..."
      #   # 可选：音量 0~1，对文件和合成提示音同时生效。
      #   volume: 0.4
      #   # 可选：设为 false 可关闭本插件。
      #   enabled: true
